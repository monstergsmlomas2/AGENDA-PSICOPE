# fly.toml app configuration file generated for agenda-psicope on 2026-06-16T18:21:24-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agenda-psicope'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  # WhatsApp apagado: no arranca Baileys ni los cron jobs de recordatorios, y
  # las rutas /whatsapp responden 503. Para reactivarlo, poner 'false' (o borrar
  # esta línea) y volver a desplegar.
  WHATSAPP_PAUSADO = 'true'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = 'agenda_data'
  destination = '/app/auth_info'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
